[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-rl"
dynamic = ["version"]
description = "Online reinforcement learning for vision-language-action models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
authors = [
  {name = "PRIME-RL Team"},
]
dependencies = [
  "numpy>=1.24,<2",
  "omegaconf>=2.3,<3",
  "packaging>=23",
  "ray[default]>=2.38,<3",
  "tensordict>=0.8,<0.11,!=0.9.0",
  "torch>=2.4",
  "huggingface-hub>=0.27,<1",
  "transformers>=4.45",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.0",
  "codetiming>=1.4",
  "datasets>=3,<4",
  "diffusers>=0.33,<0.36",
  "dill>=0.3.8",
  "draccus>=0.10,<1",
  "einops>=0.8",
  "filelock>=3.16",
  "h5py>=3.10",
  "hydra-core>=1.3,<1.4",
  "cloudpickle>=3",
  "gymnasium>=0.29,<2",
  "gcsfs>=2024.10",
  "httpx>=0.27,<1",
  "imageio[ffmpeg]>=2.34,<3",
  "json-numpy>=2.1,<3",
  "ms-swift>=3.3,<4",
  "openai>=1.0,<2",
  "opencv-python>=4.9,<5",
  "pandas>=2,<3",
  "peft>=0.11",
  "pillow>=10",
  "pyarrow>=19",
  "requests>=2.32,<3",
  "safetensors>=0.4",
  "scipy>=1.11",
  "tensorflow-cpu>=2.18,<2.19; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "tensorboard>=2.15",
  "timm>=0.9,<1",
  "torchvision>=0.19",
  "tqdm>=4.66",
  "wandb>=0.18",
]
pi05 = [
  "augmax>=0.3.4,<0.5",
  "beartype>=0.19,<0.23",
  "chex>=0.1.87,<0.2",
  "etils[epath]>=1.9,<2",
  "flax==0.10.2",
  "fsspec[gcs]>=2024.6",
  "jax==0.5.3",
  "jaxtyping==0.2.36",
  "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
  "ml-collections==1.0.0",
  "numpydantic>=1.6.6,<2",
  "openpi-client>=0.1,<0.2",
  "optax>=0.2.4,<0.3",
  "orbax-checkpoint==0.11.13",
  "pydantic>=2,<3",
  "sentencepiece>=0.2,<0.3",
  "tqdm-loggable>=0.2,<0.3",
  "typing-extensions>=4.12",
  "tyro>=0.9.5,<1",
]
dev = [
  "build>=1.2",
  "ruff>=0.9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "verl_vla/version/version"}

[tool.setuptools.packages.find]
include = ["verl_vla*"]

[tool.setuptools.package-data]
verl_vla = [
  "version/version",
  "trainer/config/*.yaml",
  "trainer/config/*/*.yaml",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
